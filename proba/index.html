var dragL=false,dragR=false,px=0,py=0;
function pick(e){mouse.x=(e.clientX/innerWidth)*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;
ray.setFromCamera(mouse,cam);var hs=ray.intersectObjects(picks,false);
for(var i=0;i<hs.length;i++)if(hs[i].object.material.visible!==false&&hs[i].object.parent.visible)return hs[i];
return null;}
rend.domElement.addEventListener("contextmenu",function(e){e.preventDefault();});
rend.domElement.addEventListener("mousedown",function(e){px=e.clientX;py=e.clientY;
if(e.button===0){dragL=true;downXY=[e.clientX,e.clientY];}
if(e.button===1){e.preventDefault();var h=pick(e);if(h){var i=h.object.userData.idx;
var gr=groupOfPart(i);if(gr)startAnim(gr,gr.to>0.5?0:1);
else document.getElementById("st").textContent="эта деталь неподвижна";}}
if(e.button===2)dragR=true;});
addEventListener("mouseup",function(e){
if(dragL&&downXY&&Math.abs(e.clientX-downXY[0])<4&&Math.abs(e.clientY-downXY[1])<4){
var h=pick(e);
if(ruler){if(h){rp.push(snap(h));if(rp.length>2)rp=[rp[rp.length-1]];drawRuler();}}
else if(h){selIdx=h.object.userData.idx;selLevel=(e.ctrlKey||e.altKey)?upLevel(selIdx,-1):-1;
computeSel();paint();}else{selIdx=-1;selSet=[];paint();}}
dragL=false;dragR=false;downXY=null;});
addEventListener("mousemove",function(e){var dx=e.clientX-px,dy=e.clientY-py;px=e.clientX;py=e.clientY;
if(dragL){yaw-=dx*0.006;pitch=Math.max(-1.5,Math.min(1.5,pitch+dy*0.006));place();}
if(dragR){var s2=dist*0.0012;var rt=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
target.addScaledVector(rt,-dx*s2);target.y+=dy*s2;place();}});
rend.domElement.addEventListener("wheel",function(e){e.preventDefault();
dist*=(e.deltaY>0?1.12:0.89);place();},{passive:false});
addEventListener("keydown",function(e){
if(e.key==="Tab"){e.preventDefault();if(selIdx<0)return;
selLevel=e.shiftKey?downLevel(selIdx,selLevel):upLevel(selIdx,selLevel);
computeSel();paint();}
if(e.key==="Delete"){hideSel();}
if(e.key==="Escape"){ruler=false;rp=[];if(rline){scene.remove(rline);rline=null;}
document.getElementById("br").className="";selIdx=-1;selSet=[];paint();
document.getElementById("st").textContent="";}});
function hideSel(){for(var i=0;i<selSet.length;i++){parts[selSet[i]].g.visible=false;parts[selSet[i]].hidden=true;}
selIdx=-1;selSet=[];paint();}
function view(y,p){yaw=y;pitch=p;place();}
document.getElementById("b1").onclick=function(){view(0,0);};
document.getElementById("b2").onclick=function(){view(0,1.5);};
document.getElementById("b3").onclick=function(){view(-Math.PI/2,0);};
document.getElementById("b4").onclick=function(){view(0.7,0.28);};
document.getElementById("b5").onclick=function(){target.set(0,0,0);dist=rad*1.8;place();};
document.getElementById("m1").onclick=function(){setMode(1);};
document.getElementById("m2").onclick=function(){setMode(2);};
document.getElementById("m3").onclick=function(){setMode(3);};
document.getElementById("bh").onclick=function(){hideSel();};
document.getElementById("bs").onclick=function(){for(var i=0;i<parts.length;i++){
parts[i].g.visible=true;parts[i].hidden=false;}};
document.getElementById("br").onclick=function(){ruler=!ruler;rp=[];
if(rline){scene.remove(rline);rline=null;}this.className=ruler?"on":"";
document.getElementById("st").textContent=ruler?"линейка: укажи первую точку":"";};
document.getElementById("b7").onclick=function(){for(var gk in groups)startAnim(groups[gk],0);};
addEventListener("resize",function(){cam.aspect=innerWidth/innerHeight;
cam.updateProjectionMatrix();rend.setSize(innerWidth,innerHeight);});
place();(function loop(){requestAnimationFrame(loop);tick();rend.render(scene,cam);})();
</script></body></html>
